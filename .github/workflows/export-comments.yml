name: Export legacy comments

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/export-comments.yml"
      - "firebase/scripts/export-discussions.mjs"
      - "firebase/scripts/migration-utils.mjs"

permissions:
  contents: read
  discussions: read

concurrency:
  group: export-comments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'wildan-wicaksono/wildan-wicaksono.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Export and verify GitHub Discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/export-discussions.mjs --output migrations/github-discussions-verified.json

      - name: Report migration checksum and counts
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { validateProductionSnapshot, validateSnapshot } from './scripts/migration-utils.mjs';
          const snapshot = JSON.parse(readFileSync('migrations/github-discussions-verified.json', 'utf8'));
          validateProductionSnapshot(snapshot);
          const summary = validateSnapshot(snapshot);
          console.log(JSON.stringify({
            migrationId: snapshot.migrationId,
            capturedAt: snapshot.capturedAt,
            snapshotSHA256: snapshot.contentSha256,
            ...summary
          }, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Verified legacy comment export',
            '',
            `Snapshot SHA-256: \`${snapshot.contentSha256}\``,
            '',
            `Discussions: ${summary.discussions}; comments: ${summary.comments}; replies: ${summary.replies}.`,
            '',
            'Download the verified snapshot artifact and review it before Firebase import.',
            'This workflow only reads GitHub Discussions; it does not import data or activate comments.',
            ''
          ].join('\n'));
          NODE

      - name: Upload verified snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-discussions-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: firebase/migrations/github-discussions-verified.json
          if-no-files-found: error
          retention-days: 30

