hero_role: "Mathematics graduate, olympiad instructor, and author."
hero_intro: "I hold a bachelor's degree in Mathematics from Universitas Brawijaya. My current research interests lie in number theory, with recent work on counting problems involving integer matrices. Alongside my research, I teach olympiad mathematics to students from elementary through senior high school and develop problems and learning resources."
