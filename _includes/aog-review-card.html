<figure class="aog-review{% if include.featured %} aog-review--featured{% endif %}">
  <span class="aog-review-quote" aria-hidden="true">&ldquo;</span>
  <blockquote>
    {% for paragraph in include.review.paragraphs %}
      {{ paragraph | markdownify }}
    {% endfor %}
  </blockquote>
  <figcaption>
    <strong>{% if include.review.anonymous %}Pembaca anonim{% else %}{{ include.review.name | default: 'Pembaca AOG' | escape }}{% endif %}</strong>
    {% unless include.review.anonymous %}
      {% if include.review.role %}<span>{{ include.review.role | escape }}</span>{% endif %}
    {% endunless %}
    {% if include.review.reading_note %}
      <span class="aog-review-reading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false"><path d="M12 5.5C9 3.5 5 3.5 2 5v15c3-1.5 7-1.5 10 .5 3-2 7-2 10-.5V5c-3-1.5-7-1.5-10 .5Zm0 0v15"/></svg>
        {{ include.review.reading_note | escape }}
      </span>
    {% endif %}
  </figcaption>
</figure>
