<script>
(function () {
  "use strict";

  function loadGiscus() {
    var container = document.querySelector(".giscus");
    if (!container || container.querySelector("script[data-giscus-loader]")) return;

    var giscus = document.createElement("script");
    var isDark = document.documentElement.getAttribute("data-theme") === "dark";
    giscus.src = "https://giscus.app/client.js";
    giscus.async = true;
    giscus.crossOrigin = "anonymous";
    giscus.setAttribute("data-giscus-loader", "");
    giscus.setAttribute("data-repo", "wildan-wicaksono/wildan-wicaksono.github.io");
    giscus.setAttribute("data-repo-id", "R_kgDOMSB9Lw");
    giscus.setAttribute("data-category", "Announcements");
    giscus.setAttribute("data-category-id", "DIC_kwDOMSB9L84DFevy");
    giscus.setAttribute("data-mapping", "pathname");
    giscus.setAttribute("data-strict", "1");
    giscus.setAttribute("data-reactions-enabled", "1");
    giscus.setAttribute("data-emit-metadata", "0");
    giscus.setAttribute("data-input-position", "top");
    giscus.setAttribute("data-theme", isDark ? "dark_dimmed" : "light");
    giscus.setAttribute("data-lang", "id");
    giscus.setAttribute("data-loading", "lazy");
    container.appendChild(giscus);
  }

  function initializeComments() {
    var root = document.getElementById("native-comments");
    var settings = document.getElementById("native-comments-settings");
    if (!root || !settings) { loadGiscus(); return; }
    var started = false;

    function start() {
      if (started) return;
      started = true;
      var abort = new AbortController();
      var finished = false;
      var timer;
      function fallback(error) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        abort.abort();
        root.hidden = true;
        loadGiscus();
        if (error) console.warn("Could not load comments; using GitHub comments.", error.code || error.message);
      }
      timer = setTimeout(function () { fallback(); }, 15000);
      try {
        var configuration = JSON.parse(settings.textContent);
        import({{ '/assets/js/comments/app.js?v=2' | relative_url | jsonify }})
          .then(function (module) {
            if (finished) return null;
            return module.startComments(root, configuration, { signal: abort.signal });
          })
          .then(function (controller) {
            if (!controller) return;
            if (finished) { controller.destroy(); return; }
            finished = true;
            clearTimeout(timer);
            document.querySelector(".giscus").hidden = true;
          })
          .catch(fallback);
      } catch (error) { fallback(error); }
    }

    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        if (entries.some(function (entry) { return entry.isIntersecting; })) {
          observer.disconnect();
          start();
        }
      }, { rootMargin: "300px" });
      observer.observe(root);
    } else start();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeComments);
  } else {
    initializeComments();
  }
}());
</script>

<!-- end custom comments snippet -->
